[project]
name = "catto"
version = "0.0.0"
description = "Multipurpose Discord bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.4",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "psutil>=5.9",
    "Faker>=18",
    "Pillow>=10",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "yt-dlp>=2024.11",
    "PyNaCl>=1.5",
    "edge-tts>=6.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
